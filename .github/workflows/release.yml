name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # OIDC：npm Trusted Publishing 必需（免 NPM_TOKEN）

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted Publishing 要求 npm CLI >= 11.5.1（node 22 自带的版本偏低，先升级）
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm api:check
      # OIDC 交换凭证，无需 NODE_AUTH_TOKEN；各包须在 npm 后台配置 Trusted Publisher 指向本 workflow
      # publish 幂等：跳过 npm 已存在的版本（中途失败如 provenance 校验重跑不会 403）
      - run: node scripts/publish-skip-existing.mjs
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
