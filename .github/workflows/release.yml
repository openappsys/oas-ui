name: Release

on:
  push:
    tags:
      - 'v*'

# 顶层默认零权限：两个 job 各自声明所需的最小权限（verify 不给 publish 任何额外权限）
permissions: {}

jobs:
  # ── 第一道门禁：tag 指向的提交必须有同仓库完整 CI（ci.yml）completed+success 记录 ──
  # fail closed：无记录 / pending / failure / 其他 SHA / 非 CI workflow 一律不放行（无等待、无跳过通道）
  verify-quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout 本仓库
      actions: read # 查询 CI run 状态的最小权限
    steps:
      - uses: actions/checkout@v4
      - name: 同 SHA 完整 CI 全绿校验（gh api 查询，判定矩阵见 scripts/release-gate.mjs）
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-check.mjs --verify-ci

  # ── 发布：依赖 verify-quality；checkout 固定在「验证通过的那个提交」（非 tag ref）──
  publish:
    needs: verify-quality
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 GitHub Release
      id-token: write # OIDC：npm Trusted Publishing 必需（免 NPM_TOKEN）
    steps:
      # 固定验证通过的 SHA：tag 若在验证后被移动，后续 tag=HEAD 校验会失败而不是发布到另一提交；
      # fetch-depth: 0 完整历史：tag 解引用（v<版本>^{commit}）与上版基线 diff 需要全部 tag/提交
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      # 发布前硬校验（CI 严格模式）：tag v<版本> 必须解析到已验证的 HEAD，版本号/CHANGELOG 一致；
      # 非 semver tag 直接失败。必须在 build/api:check/发布之前跑
      - run: node scripts/release-check.mjs "${GITHUB_REF_NAME#v}" --require-tag-head
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted Publishing 要求 npm CLI >= 11.5.1；不能用 latest（npm 12 起要求 Node >=22.22.2，
      # 本仓库 .nvmrc 锁 22.18.0），固定在兼容的 11.x 最新
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm api:check
      # OIDC 交换凭证，无需 NODE_AUTH_TOKEN；各包须在 npm 后台配置 Trusted Publisher 指向本 workflow
      # publish 幂等：跳过 npm 已存在的版本（中途失败如 provenance 校验重跑不会 403）
      - run: node scripts/publish-skip-existing.mjs
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
