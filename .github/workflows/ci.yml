name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm skill:check
      # 发布门禁自测：release-gate 判定矩阵 + release-check 严格/本地模式 + release.yml 静态断言
      - run: pnpm release:check:test
      - run: pnpm test
      # 断言质量基线：新增无 expect / 无条件 skip / 固定等待膨胀会红灯
      # 阈值 = 历史债快照（2026-10-29 实测）：wait/weak 无余量、eventLen 保留余量（实测 96 / 阈值 105）；不得每批静默抬阈值
      - run: pnpm qa:audit:check
      # typecheck 依赖各 workspace 包的 d.ts（build 产物 dist/types）——必须 build 之后跑
      - run: pnpm build
      - run: pnpm typecheck
      # 官网首页统计数字防漂移（与 api:check 同机制：重新生成 + git diff）。
      # ⚠️ 必须排在 perf:size 之前：perf:size 会用当前环境实测的 gzip 字节改写
      # docs/perf-baseline.json，而 stats:gen 的三个 perf 字段正是读这份基线 →
      # 若先跑 perf:size，CI 会拿「环境实测数字」去比「提交版数字」，必然误报（本 job 曾长期必红）。
      - run: pnpm stats:check
      # 体积预算（vision §5.8 性能领先）：依赖 dist，必须紧跟 build 之后。
      # 渲染基准（pnpm perf:bench）耗时波动大（happy-dom + 共享 runner 抖动），不进 CI，
      # 发布前本地跑一遍核对即可（见 docs/engineering.md §4 性能基准）。
      - run: pnpm perf:size
      # 真实浏览器基线的完整性校验（只读 JSON：可解析 / 样本数 / 环境元数据齐全）。
      # 性能数值本身不阻断发布；不在此 job 跑浏览器测量（耗时/噪声），需要刷新走本地 --update-baseline。
      - run: pnpm perf:browser:check
      - run: pnpm api:check
      # 废弃 API 台账：别名必须登记，canonical 必须存在，removeIn 不得倒退；
      # 判定规则自测（含 package-export 单点例外的正反两侧）
      - run: pnpm deprecations:test
      - run: pnpm deprecations:check
      # SSR 覆盖矩阵防漂移：组件必须二选一（WHITELIST / NOT_SSR），文档数量与清单同步
      - run: pnpm ssr:check
      # /llms.txt 防漂移（llmstxt.org 规范；由 docs 侧栏 + 组件 md 生成，入库的是精选索引）
      - run: pnpm llms:check
  ssr-fixtures:
    # Next / Nuxt 生产构建 fixture：独立 job，不并入 e2e 分片（fixture 不在根 workspace，
    # 需要单独 install/build；E2E 端口 4301/4302 与文档站 4173 隔离）。
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NUXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # fixture 通过 link: 消费主仓构建产物（dist），必须先 build 主仓
      - run: pnpm build
      - name: Install Next fixture
        working-directory: packages/ssr/fixtures/next
        run: pnpm install --frozen-lockfile
      - name: Build Next fixture
        working-directory: packages/ssr/fixtures/next
        run: pnpm build
      - name: Install Nuxt fixture
        working-directory: packages/ssr/fixtures/nuxt
        run: pnpm install --frozen-lockfile
      - name: Build Nuxt fixture
        working-directory: packages/ssr/fixtures/nuxt
        run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      # 零重试（playwright.ssr.config.ts retries:0）：任何 flake 按真实问题处理
      - name: Fixture e2e (Next)
        run: SSR_FIXTURE=next pnpm test:e2e:ssr --project=next
      - name: Fixture e2e (Nuxt)
        run: SSR_FIXTURE=nuxt pnpm test:e2e:ssr --project=nuxt
      - name: Upload fixture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-fixtures-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    env:
      OAS_DOCS_ANALYTICS: 0
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 4 片实测单片 40min+（table/sidebar/toolbar 等大文件集中）；6 片降低关键路径。
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium firefox
      # 全量 e2e 分 6 片并行：大文件（table/sidebar/toolbar）不再集中压满单片关键路径。
      # WebKit 单独 job：它只有 9 条抽样，若混在 shard 6 会因 CI 未安装 webkit 而整片失败。
      - run: pnpm test:e2e --project=docs-site --project=chromium --project=firefox --shard=${{ matrix.shard }}/6
      # RTL 几何门禁（117 组件页 LTR/RTL 差集 sweep，exit 非零即红）——只跑 shard 1，免三片重复
      - name: RTL 几何门禁（仅 shard 1）
        if: matrix.shard == 1
        run: pnpm rtl:audit --no-shots
      # RTL 交互态门禁（20 浮层组件真 RTL 打开态 sweep + placement 镜像核对）
      - name: RTL 交互态门禁（仅 shard 1）
        if: matrix.shard == 1
        run: pnpm rtl:audit:interactive --no-shots
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            !test-results/visual/**
          retention-days: 7
          if-no-files-found: ignore

  e2e-webkit:
    # Playwright WebKit 依赖 libicu74；ubuntu-26.04 尚未提供兼容包，先固定已验证的 24.04 LTS
    runs-on: ubuntu-24.04
    env:
      OAS_DOCS_ANALYTICS: 0
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:e2e:webkit
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit
          path: |
            playwright-report/
            test-results/
            !test-results/visual/**
          retention-days: 7
          if-no-files-found: ignore
