name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm test
      # typecheck 依赖各 workspace 包的 d.ts（build 产物 dist/types）——必须 build 之后跑
      - run: pnpm build
      - run: pnpm typecheck
      # 体积预算（vision §5.8 性能领先）：依赖 dist，必须紧跟 build 之后。
      # 渲染基准（pnpm perf:bench）耗时波动大（happy-dom + 共享 runner 抖动），不进 CI，
      # 发布前本地跑一遍核对即可（见 docs/engineering.md §4 性能基准）。
      - run: pnpm perf:size
      - run: pnpm api:check
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium firefox
      # 全量 e2e 分 3 片并行（5 个遍历型 spec 各 7-10min，串行 15min+；shard 后 ≈ 6min）
      - run: pnpm test:e2e -- --shard=${{ matrix.shard }}/3
