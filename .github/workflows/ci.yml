name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint:md
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      # 体积预算（vision §5.8 性能领先）：依赖 dist，必须紧跟 build 之后。
      # 渲染基准（pnpm perf:bench）耗时波动大（happy-dom + 共享 runner 抖动），不进 CI，
      # 发布前本地跑一遍核对即可（见 docs/engineering.md §4 性能基准）。
      - run: pnpm perf:size
      - run: pnpm api:check
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # e2e 双浏览器：chromium 全量 + firefox 抽样（visual/smoke/qa-regression 子集，
      # 由 playwright.config.ts 的 firefox project testMatch 圈定，见 docs/engineering.md §2）
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:e2e
