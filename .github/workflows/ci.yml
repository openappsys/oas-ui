name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm skill:check
      - run: pnpm test
      # 断言质量基线：新增无 expect / 无条件 skip / 固定等待膨胀会红灯
      - run: pnpm qa:audit:check
      # typecheck 依赖各 workspace 包的 d.ts（build 产物 dist/types）——必须 build 之后跑
      - run: pnpm build
      - run: pnpm typecheck
      # 官网首页统计数字防漂移（与 api:check 同机制：重新生成 + git diff）。
      # ⚠️ 必须排在 perf:size 之前：perf:size 会用当前环境实测的 gzip 字节改写
      # docs/perf-baseline.json，而 stats:gen 的三个 perf 字段正是读这份基线 →
      # 若先跑 perf:size，CI 会拿「环境实测数字」去比「提交版数字」，必然误报（本 job 曾长期必红）。
      - run: pnpm stats:check
      # 体积预算（vision §5.8 性能领先）：依赖 dist，必须紧跟 build 之后。
      # 渲染基准（pnpm perf:bench）耗时波动大（happy-dom + 共享 runner 抖动），不进 CI，
      # 发布前本地跑一遍核对即可（见 docs/engineering.md §4 性能基准）。
      - run: pnpm perf:size
      - run: pnpm api:check
      # 废弃 API 台账：别名必须登记，canonical 必须存在，removeIn 不得倒退
      - run: pnpm deprecations:check
      # SSR 覆盖矩阵防漂移：组件必须二选一（WHITELIST / NOT_SSR），文档数量与清单同步
      - run: pnpm ssr:check
      # /llms.txt 防漂移（llmstxt.org 规范；由 docs 侧栏 + 组件 md 生成，入库的是精选索引）
      - run: pnpm llms:check
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 4 片实测单片 40min+（table/sidebar/toolbar 等大文件集中）；6 片降低关键路径。
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium firefox
      # 全量 e2e 分 6 片并行：大文件（table/sidebar/toolbar）不再集中压满单片关键路径。
      # WebKit 单独 job：它只有 9 条抽样，若混在 shard 6 会因 CI 未安装 webkit 而整片失败。
      - run: pnpm test:e2e -- --project=docs-site --project=chromium --project=firefox --shard=${{ matrix.shard }}/6
      # RTL 几何门禁（117 组件页 LTR/RTL 差集 sweep，exit 非零即红）——只跑 shard 1，免三片重复
      - name: RTL 几何门禁（仅 shard 1）
        if: matrix.shard == 1
        run: pnpm rtl:audit --no-shots
      # RTL 交互态门禁（20 浮层组件真 RTL 打开态 sweep + placement 镜像核对）
      - name: RTL 交互态门禁（仅 shard 1）
        if: matrix.shard == 1
        run: pnpm rtl:audit:interactive --no-shots
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            !test-results/visual/**
          retention-days: 7
          if-no-files-found: ignore

  e2e-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps webkit
      - run: pnpm test:e2e:webkit
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit
          path: |
            playwright-report/
            test-results/
            !test-results/visual/**
          retention-days: 7
          if-no-files-found: ignore
