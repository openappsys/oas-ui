name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm skill:check
      # 发布门禁自测：release-gate 判定矩阵 + release-check 严格/本地模式 + release.yml 静态断言
      - run: pnpm release:check:test
      - run: pnpm test
      # 断言质量基线：新增无 expect / 无条件 skip / 固定等待膨胀会红灯
      # 阈值 = 历史债快照（2026-10-29 实测）：wait/weak 无余量、eventLen 保留余量（实测 96 / 阈值 105）；不得每批静默抬阈值
      - run: pnpm qa:audit:check
      # typecheck 依赖各 workspace 包的 d.ts（build 产物 dist/types）——必须 build 之后跑
      - run: pnpm build
      - run: pnpm typecheck
      # 官网首页统计数字防漂移（与 api:check 同机制：重新生成 + git diff）。
      # ⚠️ 必须排在 perf:size 之前：perf:size 会用当前环境实测的 gzip 字节改写
      # docs/perf-baseline.json，而 stats:gen 的三个 perf 字段正是读这份基线 →
      # 若先跑 perf:size，CI 会拿「环境实测数字」去比「提交版数字」，必然误报（本 job 曾长期必红）。
      - run: pnpm stats:check
      # 体积预算（vision §5.8 性能领先）：依赖 dist，必须紧跟 build 之后。
      # 渲染基准（pnpm perf:bench）耗时波动大（happy-dom + 共享 runner 抖动），不进 CI，
      # 发布前本地跑一遍核对即可（见 docs/engineering.md §4 性能基准）。
      - run: pnpm perf:size
      # 真实浏览器基线的完整性校验（只读 JSON：可解析 / 样本数 / 指标全有限 / 环境元数据齐全）。
      # 先跑校验器自测（缺样本 / NaN / null LCP 必须非零退出），再校验入库基线。
      # 性能数值本身不阻断发布；不在此 job 跑浏览器测量（耗时/噪声），需要刷新走本地 --update-baseline。
      - run: pnpm perf:browser:selftest
      - run: pnpm perf:browser:check
      - run: pnpm api:check
      # 废弃 API 台账：别名必须登记，canonical 必须存在，removeIn 不得倒退；
      # 判定规则自测（含 package-export 单点例外的正反两侧）
      - run: pnpm deprecations:test
      - run: pnpm deprecations:check
      # SSR 覆盖矩阵防漂移：组件必须二选一（WHITELIST / NOT_SSR），文档数量与清单同步
      - run: pnpm ssr:check
      # /llms.txt 防漂移（llmstxt.org 规范；由 docs 侧栏 + 组件 md 生成，入库的是精选索引）
      - run: pnpm llms:check
  # 兼容窗口：engines 声明 22.18 / 24 / 26，CI 除最新 LTS 外再跑最低支持线与上一 LTS，
  # 防「只在 26 上验证、却在 22 上用了新 API/语法」的静默漂移。不跑 e2e（成本），保留单测 + build。
  node-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18.0', '24.22.2']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  ssr-fixtures:
    # Next / Nuxt 生产构建 fixture：独立 job，不并入 e2e 分片（fixture 不在根 workspace，
    # 需要单独 install/build；E2E 端口 4301/4302 与文档站 4173 隔离）。
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NUXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # fixture 通过 link: 消费主仓构建产物（dist），必须先 build 主仓
      - run: pnpm build
      - name: Install Next fixture
        working-directory: packages/ssr/fixtures/next
        run: pnpm install --frozen-lockfile
      - name: Build Next fixture
        working-directory: packages/ssr/fixtures/next
        run: pnpm build
      - name: Install Nuxt fixture
        working-directory: packages/ssr/fixtures/nuxt
        run: pnpm install --frozen-lockfile
      - name: Build Nuxt fixture
        working-directory: packages/ssr/fixtures/nuxt
        run: pnpm build
      # fixture 独立 typecheck：不并入根 typecheck（fixture 不在根 workspace）
      - name: Typecheck Next fixture
        working-directory: packages/ssr/fixtures/next
        run: pnpm typecheck
      - name: Typecheck Nuxt fixture
        working-directory: packages/ssr/fixtures/nuxt
        run: pnpm typecheck
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      # 安装停滞自愈：下载挂死时进程不退出、shell 重试不会触发，必须命令内 timeout 把挂死翻译成
      # 非零退出再重试（2026-11-05 实发：webkit 安装挂死 44 分钟被 cancel 拖垮整 run）。
      # 正常安装实测 30-40s，单次给 8 分钟余量；共 3 次尝试，step 级 30 分钟兜底。
      - name: Install Playwright browsers
        timeout-minutes: 30
        run: |
          # apt 源故障自愈：GitHub runner 默认 azure 镜像索引陈旧/缺包时 apt 依赖装不上
          # （2026-11-06 实发：libcodec2/fonts-wqy-zenhei 拉取 exit 100，重试耗尽拖垮 e2e 分片）。
          # 第一版固定路径 sed 实测无效（runner 镜像源文件布局与预期不符，update 仍打 azure），
          # 改为全 /etc/apt 扫描替换 + 结果自检输出；清索引强制重取（只改源不重取，缓存索引仍指旧源）。
          grep -rl 'azure\.archive\.ubuntu\.com' /etc/apt/ 2>/dev/null | while read -r f; do
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' "$f"
            echo "mirror switched: $f"
          done
          grep -r 'azure\.archive\.ubuntu\.com' /etc/apt/ 2>/dev/null && echo 'WARN: azure refs remain' || echo 'mirror check: no azure refs'
          sudo rm -rf /var/lib/apt/lists/*
          # 索引刷新必须成功：源故障不吞错，fail fast 让 job 立刻红（重试只兜网络抖动，
          # 不兜源配置错误——吞掉 update 失败会让后续 install 在陈旧索引上重试三次再失败）
          sudo apt-get update
          for attempt in 1 2 3; do
            echo "== playwright install attempt $attempt/3 =="
            # 上次尝试被 timeout 杀死后可能残留持锁 apt/dpkg 进程：重试前清锁并补修 dpkg
            # 中间态（半安装的包会让后续 apt 全线失败），保证每轮重试从干净状态出发
            sudo fuser -k /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock 2>/dev/null || true
            sudo dpkg --configure -a
            if timeout --kill-after=30s 480s pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "attempt $attempt failed, retry in 15s"
            sleep 15
          done
          exit 1
      # 零重试（playwright.ssr.config.ts retries:0）：任何 flake 按真实问题处理
      - name: Fixture e2e (Next)
        run: SSR_FIXTURE=next pnpm test:e2e:ssr --project=next
      - name: Fixture e2e (Nuxt)
        run: SSR_FIXTURE=nuxt pnpm test:e2e:ssr --project=nuxt
      # Firefox DSD 验证（nuxt-firefox project：原生 DSD 水合 / 运行期注入 + polyfill / 无 polyfill 降级）。
      # Firefox 无 apt 系统依赖（不像 chromium 需要 --with-deps），直接装浏览器即可。
      - name: Install Playwright Firefox (fixture DSD)
        run: pnpm exec playwright install firefox
      - name: Fixture e2e (Nuxt · Firefox DSD)
        run: SSR_FIXTURE=nuxt pnpm test:e2e:ssr --project=nuxt-firefox
      - name: Upload fixture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssr-fixtures-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    env:
      OAS_DOCS_ANALYTICS: 0
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 4 片实测单片 40min+（table/sidebar/toolbar 等大文件集中）；6 片降低关键路径。
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      # 安装停滞自愈：下载挂死时进程不退出、shell 重试不会触发，必须命令内 timeout 把挂死翻译成
      # 非零退出再重试（2026-11-05 实发：webkit 安装挂死 44 分钟被 cancel 拖垮整 run）。
      # 正常安装实测 30-40s，单次给 8 分钟余量；共 3 次尝试，step 级 30 分钟兜底。
      - name: Install Playwright browsers
        timeout-minutes: 30
        run: |
          # apt 源故障自愈：GitHub runner 默认 azure 镜像索引陈旧/缺包时 apt 依赖装不上
          # （2026-11-06 实发：libcodec2/fonts-wqy-zenhei 拉取 exit 100，重试耗尽拖垮 e2e 分片）。
          # 第一版固定路径 sed 实测无效（runner 镜像源文件布局与预期不符，update 仍打 azure），
          # 改为全 /etc/apt 扫描替换 + 结果自检输出；清索引强制重取（只改源不重取，缓存索引仍指旧源）。
          grep -rl 'azure\.archive\.ubuntu\.com' /etc/apt/ 2>/dev/null | while read -r f; do
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' "$f"
            echo "mirror switched: $f"
          done
          grep -r 'azure\.archive\.ubuntu\.com' /etc/apt/ 2>/dev/null && echo 'WARN: azure refs remain' || echo 'mirror check: no azure refs'
          sudo rm -rf /var/lib/apt/lists/*
          # 索引刷新必须成功：源故障不吞错，fail fast 让 job 立刻红（重试只兜网络抖动，
          # 不兜源配置错误——吞掉 update 失败会让后续 install 在陈旧索引上重试三次再失败）
          sudo apt-get update
          for attempt in 1 2 3; do
            echo "== playwright install attempt $attempt/3 =="
            # 上次尝试被 timeout 杀死后可能残留持锁 apt/dpkg 进程：重试前清锁并补修 dpkg
            # 中间态（半安装的包会让后续 apt 全线失败），保证每轮重试从干净状态出发
            sudo fuser -k /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock 2>/dev/null || true
            sudo dpkg --configure -a
            if timeout --kill-after=30s 480s pnpm exec playwright install --with-deps chromium firefox; then
              exit 0
            fi
            echo "attempt $attempt failed, retry in 15s"
            sleep 15
          done
          exit 1
      # 全量 e2e 分 6 片并行：大文件（table/sidebar/toolbar）不再集中压满单片关键路径。
      # WebKit 单独 job：它只有 9 条抽样，若混在 shard 6 会因 CI 未安装 webkit 而整片失败。
      - run: pnpm test:e2e --project=docs-site --project=chromium --project=firefox --shard=${{ matrix.shard }}/6
      # RTL 几何门禁（117 组件页 LTR/RTL 差集 sweep，exit 非零即红）——只跑 shard 1，免三片重复
      - name: RTL 几何门禁（仅 shard 1）
        if: matrix.shard == 1
        run: pnpm rtl:audit --no-shots
      # RTL 交互态门禁（20 浮层组件真 RTL 打开态 sweep + placement 镜像核对）
      - name: RTL 交互态门禁（仅 shard 1）
        if: matrix.shard == 1
        run: pnpm rtl:audit:interactive --no-shots
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            !test-results/visual/**
          retention-days: 7
          if-no-files-found: ignore

  e2e-webkit:
    # Playwright WebKit 依赖 libicu74；ubuntu-26.04 尚未提供兼容包，先固定已验证的 24.04 LTS
    runs-on: ubuntu-24.04
    env:
      OAS_DOCS_ANALYTICS: 0
      # 2 核 runner 上 4 workers 抢 CPU 导致动画/虚拟滚动/时序族用例持续饥饿 flake
      # （三轮 CI 实证：marquee/scale/slot-template/select/slider/table/conversation 轮换复现，
      #  连续两次尝试同败）——降到 2 workers，用 4 分片补偿墙钟。
      E2E_WORKERS: 2
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ hashFiles('pnpm-lock.yaml') }}
      # 安装停滞自愈：下载挂死时进程不退出、shell 重试不会触发，必须命令内 timeout 把挂死翻译成
      # 非零退出再重试（2026-11-05 实发：webkit 安装挂死 44 分钟被 cancel 拖垮整 run）。
      # 正常安装实测 30-40s，单次给 8 分钟余量；共 3 次尝试，step 级 30 分钟兜底。
      - name: Install Playwright browsers
        timeout-minutes: 30
        run: |
          # apt 源故障自愈：GitHub runner 默认 azure 镜像索引陈旧/缺包时 apt 依赖装不上
          # （2026-11-06 实发：libcodec2/fonts-wqy-zenhei 拉取 exit 100，重试耗尽拖垮 e2e 分片）。
          # 第一版固定路径 sed 实测无效（runner 镜像源文件布局与预期不符，update 仍打 azure），
          # 改为全 /etc/apt 扫描替换 + 结果自检输出；清索引强制重取（只改源不重取，缓存索引仍指旧源）。
          grep -rl 'azure\.archive\.ubuntu\.com' /etc/apt/ 2>/dev/null | while read -r f; do
            sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' "$f"
            echo "mirror switched: $f"
          done
          grep -r 'azure\.archive\.ubuntu\.com' /etc/apt/ 2>/dev/null && echo 'WARN: azure refs remain' || echo 'mirror check: no azure refs'
          sudo rm -rf /var/lib/apt/lists/*
          # 索引刷新必须成功：源故障不吞错，fail fast 让 job 立刻红（重试只兜网络抖动，
          # 不兜源配置错误——吞掉 update 失败会让后续 install 在陈旧索引上重试三次再失败）
          sudo apt-get update
          for attempt in 1 2 3; do
            echo "== playwright install attempt $attempt/3 =="
            # 上次尝试被 timeout 杀死后可能残留持锁 apt/dpkg 进程：重试前清锁并补修 dpkg
            # 中间态（半安装的包会让后续 apt 全线失败），保证每轮重试从干净状态出发
            sudo fuser -k /var/lib/dpkg/lock-frontend /var/lib/apt/lists/lock 2>/dev/null || true
            sudo dpkg --configure -a
            if timeout --kill-after=30s 480s pnpm exec playwright install --with-deps webkit; then
              exit 0
            fi
            echo "attempt $attempt failed, retry in 15s"
            sleep 15
          done
          exit 1
      # webkit 在 2 核 runner 上的负载 flake 治理：worker 数 CI 默认 4 减半到 2
      # （playwright.config.ts 的 E2E_WORKERS 环境变量通道；只降 webkit，chromium/firefox 不动）。
      # 高并发抢 CPU 是 marquee/countdown/table 时序断言反复抖动的结构性根因，降载即降噪。
      - run: E2E_WORKERS=2 pnpm test:e2e:webkit --shard=${{ matrix.shard }}/4
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webkit-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
            !test-results/visual/**
          retention-days: 7
          if-no-files-found: ignore
